name: Build ESA STRUK APK
on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant Execute Permission
      run: chmod +x ./gradlew
    - name: Restore Original Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi
    - name: Build APK
      run: ./gradlew assembleDebug
    - name: Copy Named APK
      run: cp app/build/outputs/apk/debug/app-debug.apk ESASTRUK-2.3.apk
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESASTRUK-APK
        path: ESASTRUK-2.3.apk
    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.3
        name: ESA STRUK v2.3
        draft: false
        prerelease: false
        make_latest: true
        files: ESASTRUK-2.3.apk
        body: |
          Rilis Terbaru ESA STRUK v2.3 - Cetak Struk Digital & Bukti Transfer
          
          Fitur Utama:
          - Rebranding aplikasi: ESA STRUK
          - Terima share gambar bukti transfer langsung dari BCA, BRI, Mandiri, BNI, DANA, GoPay, dan QRIS
          - Ekstraksi OCR cerdas untuk nominal, tanggal, rekening, nama penerima, dan no referensi
          - Cetak ke printer thermal Bluetooth ESC/POS ukuran 58mm & 80mm
          - Pratinjau cetak digital yang rapi dan terukur
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
